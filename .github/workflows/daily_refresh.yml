name: Refresh Dashboard

on:
  schedule:
    - cron: '30 5 * * *'    # 11:00 AM IST (UTC+5:30)
    - cron: '30 6 * * *'    # 12:00 PM IST
    - cron: '30 7 * * *'    # 01:00 PM IST
  workflow_dispatch:          # Manual trigger from GitHub UI anytime

# Permissions the jobs need:
#   contents: write  -> to commit the refreshed HTML back to the repo
#   pages:    write  -> to publish to GitHub Pages
#   id-token: write  -> required by actions/deploy-pages (OIDC)
permissions:
  contents: write
  pages: write
  id-token: write

# Only one Pages deployment at a time. This is the fix for the intermittent
# "Deployment failed, try again later." errors — overlapping runs now queue
# instead of racing for the single github-pages slot.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Install dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 4. Write credentials.json from GitHub Secret
      - name: Write Google credentials
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json

      # 5. Fetch data from Google Sheets
      - name: Fetch data
        run: python fetch_data.py

      # 6. Run calculations
      - name: Calculate metrics
        run: python calculate.py

      # 7. Build dashboard HTML
      - name: Build dashboard
        run: python build_dashboard.py

      # 8. Commit and push the new dashboard HTML (keeps it versioned in the repo)
      - name: Commit dashboard
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nh_category_intel.html
          git diff --staged --quiet || git commit -m "Refresh dashboard — $(TZ='Asia/Kolkata' date +'%d %b %Y %H:%M IST')"
          git push

      # 9. Assemble a clean publish folder with ONLY the public HTML.
      #    This deliberately excludes credentials.json, the .py source and
      #    data/ so none of that is ever served on the public site.
      - name: Prepare site
        run: |
          mkdir -p _site
          cp *.html _site/

      # 10. Upload the publish folder as the Pages artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Separate deploy job so the site publishes only after a successful build.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
