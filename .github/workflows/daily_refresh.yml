name: Refresh Dashboard

on:
  schedule:
    - cron: '30 5 * * *'    # 11:00 AM IST (UTC+5:30) – dashboard refresh; morning brief backup (primary: cron-job.org)
    - cron: '30 6 * * *'    # 12:00 PM IST
    - cron: '30 7 * * *'    # 01:00 PM IST
  workflow_dispatch:          # Manual trigger from GitHub UI anytime
    inputs:
      brief_mode:
        description: "Morning brief: off = refresh only, test = send all briefs to TEST_RECIPIENT, send = real send"
        type: choice
        options: ["off", "test", "send"]
        default: "off"
      resend:
        description: "Tick only to send the brief again on a day it already went out"
        type: boolean
        default: false

# Permissions the jobs need:
#   contents: write  -> to commit the refreshed HTML back to the repo
#   pages:    write  -> to publish to GitHub Pages
#   id-token: write  -> required by actions/deploy-pages (OIDC)
permissions:
  contents: write
  pages: write
  id-token: write

# Only one Pages deployment at a time. This is the fix for the intermittent
# "Deployment failed, try again later." errors — overlapping runs now queue
# instead of racing for the single github-pages slot.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Install dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 4. Write credentials.json from GitHub Secret
      - name: Write Google credentials
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json

      # 5. Fetch data from Google Sheets
      - name: Fetch data
        run: python fetch_data.py

      # 6. Run calculations
      - name: Calculate metrics
        run: python calculate.py

      # 6b. Save today's snapshot of month-to-date numbers (used by the WBR agent for weekly figures)
      - name: Save snapshot
        continue-on-error: true
        run: python snapshots.py save

      # 7. Build dashboard HTML
      - name: Build dashboard
        run: python build_dashboard.py

      # 7b. Morning brief — only on the 11 AM run, or when triggered manually with test/send.
      #     continue-on-error: a brief problem never blocks the dashboard refresh.
      - name: Morning brief
        # Real send only on the FIRST attempt of the 11 AM schedule (a "Re-run" of it does not send).
        # Manual runs send only when brief_mode is exactly "test" or "send".
        if: (github.event.schedule == '30 5 * * *' && github.run_attempt == '1') || (github.event_name == 'workflow_dispatch' && (inputs.brief_mode == 'test' || inputs.brief_mode == 'send'))
        continue-on-error: true
        env:
          BRIEF_MODE: ${{ github.event_name == 'schedule' && 'send' || inputs.brief_mode }}
          BRIEF_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.resend && 'yes' || 'no' }}
          # The 11 AM schedule is only a backup for cron-job.org; if GitHub starts it after 2 PM, no brief is sent.
          BRIEF_NOT_AFTER: ${{ github.event_name == 'schedule' && '14:00' || '' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TEST_RECIPIENT: ${{ secrets.TEST_RECIPIENT }}
        run: python brief.py

      # 7c. Keep a copy of the email previews for 7 days (Actions → run → Artifacts)
      - name: Save brief previews
        if: always() && hashFiles('brief_output/*.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: morning-brief-previews
          path: brief_output/
          retention-days: 7

      # 8. Commit and push the new dashboard HTML (keeps it versioned in the repo)
      #    plus the brief's memory of what it has already raised.
      - name: Commit dashboard
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nh_category_intel.html
          if [ -d agent_state ]; then git add agent_state; fi
          git diff --staged --quiet && exit 0
          git commit -m "Refresh dashboard — $(TZ='Asia/Kolkata' date +'%d %b %Y %H:%M IST')"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done

      # 9. Assemble a clean publish folder with ONLY the public HTML.
      #    This deliberately excludes credentials.json, the .py source and
      #    data/ so none of that is ever served on the public site.
      - name: Prepare site
        run: |
          mkdir -p _site
          cp *.html _site/

      # 10. Upload the publish folder as the Pages artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Separate deploy job so the site publishes only after a successful build.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
